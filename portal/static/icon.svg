<?xml version="1.0" encoding="UTF-8"?>
<!--
  icon.svg: source for the home-screen icon (apple-touch-icon.png), the
  512px app icon and the browser-tab favicon.
  A tiny copy of the Synthwave scene behind every page (scene.css): night
  sky, mountains on the horizon and a cyan neon floor, where the setting
  sun is a game controller. It has the sun's colors and stripes, and its
  d-pad and buttons are holes that show the sky through.
  The square is full-bleed on purpose: iPhones round the corners
  themselves, and transparent areas would turn black.
  To rebuild the PNGs after editing this file (rsvg-convert comes from
  `brew install librsvg`), from the repo root:
    rsvg-convert -w 180 -h 180 portal/static/icon.svg -o portal/static/apple-touch-icon.png
    rsvg-convert -w 512 -h 512 portal/static/icon.svg -o portal/static/icon-512.png
    rsvg-convert -w 32 -h 32 portal/static/icon.svg -o portal/static/favicon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <!-- same colors as scene.css -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0538"/>
      <stop offset=".35" stop-color="#1f0868"/>
      <stop offset=".52" stop-color="#4a0b7c"/>
      <stop offset=".62" stop-color="#8a0f8f"/>
    </linearGradient>
    <!-- the sunset, top to bottom of the controller (y 33 to 107) -->
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="33" x2="0" y2="107">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset=".45" stop-color="#ff9a2e"/>
      <stop offset=".72" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#ff2a7a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a6a"/>
      <stop offset=".35" stop-color="#1a0648"/>
      <stop offset="1" stop-color="#0a0326"/>
    </linearGradient>
    <!-- What's left of the controller-sun: its outline, minus the d-pad and
         buttons, minus the sun's stripes (thicker toward the horizon) -->
    <mask id="cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="180" height="180">
      <rect width="180" height="180" fill="#000"/>
      <g transform="translate(90 107) scale(.83) translate(-90 -147)">
        <path d="M60 58 H120 C141 58 151 70 156 90 L163 121 C166 138 150 147 139 134 L125 117 H55
                 L41 134 C30 147 14 138 17 121 L24 90 C29 70 39 58 60 58 Z" fill="#fff"/>
        <rect x="44" y="83" width="28" height="10" rx="2" fill="#000"/>
        <rect x="53" y="74" width="10" height="28" rx="2" fill="#000"/>
        <circle cx="122" cy="76" r="6.5" fill="#000"/>
        <circle cx="135" cy="89" r="6.5" fill="#000"/>
        <circle cx="109" cy="89" r="6.5" fill="#000"/>
        <circle cx="122" cy="102" r="6.5" fill="#000"/>
      </g>
      <rect x="0" y="80" width="180" height="2" fill="#000"/>
      <rect x="0" y="87" width="180" height="2.8" fill="#000"/>
      <rect x="0" y="95" width="180" height="3.6" fill="#000"/>
    </mask>
    <radialGradient id="reflection" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#ff7850" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#ff28a0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff28a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="below"><rect y="112" width="180" height="68"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff3caa" flood-opacity=".7"/>
      <feComposite operator="in" in2="blur" result="pink"/>
      <feMerge><feMergeNode in="pink"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky, with a few stars -->
  <rect width="180" height="112" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="20" cy="18" r="1.2"/><circle cx="52" cy="28" r=".9"/><circle cx="150" cy="16" r="1.3"/>
    <circle cx="166" cy="40" r=".9"/><circle cx="116" cy="22" r=".8"/><circle cx="10" cy="48" r=".8"/>
  </g>

  <!-- the sun: a controller, setting on the horizon -->
  <rect y="30" width="180" height="82" fill="url(#sun)" mask="url(#cutouts)" filter="url(#glow)"/>

  <!-- low mountains, so the controller's grips still show above them -->
  <polygon points="0,112 0,103 14,97 28,102 40,95 50,101 64,99 78,105 90,103 102,105 116,99 130,101 140,95 152,102 166,97 180,103 180,112"
           fill="#2a0b4a" stroke="#b0249c" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="0,112 0,107 22,104 40,108 60,105 82,109 104,105 126,109 148,104 166,107 180,105 180,112" fill="#16052b"/>

  <!-- neon floor: lines fanning out from a point just above the horizon, cross lines bunching up toward it -->
  <rect y="112" width="180" height="68" fill="url(#floor)"/>
  <g clip-path="url(#below)" stroke="#22e8ff" stroke-opacity=".75" stroke-width="1.6" fill="none">
    <path d="M90 104 L-210 180 M90 104 L-120 180 M90 104 L-30 180 M90 104 L60 180 M90 104 L120 180
             M90 104 L210 180 M90 104 L300 180 M90 104 L390 180"/>
    <path d="M0 115.5 H180 M0 120 H180 M0 126 H180 M0 134.5 H180 M0 146 H180 M0 162 H180"/>
  </g>
  <!-- the horizon's pink glow line -->
  <rect y="111" width="180" height="1.6" fill="#ff4fd8"/>
  <!-- the sun's reflection on the floor -->
  <ellipse clip-path="url(#below)" cx="90" cy="112" rx="40" ry="22" fill="url(#reflection)"/>
</svg>
